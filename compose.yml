services:
  ai-task-agent:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      # - "6574:6574"
      - "127.0.0.1:6574:6574"
      - "127.0.0.1:6575:6575"
    volumes:
      - ./transfer:/app/transfer
      - ./brain:/root/brain
      - ./knowledge:/app/knowledge:ro
      - ./ragdata:/app/rag
    shm_size: "8gb"
    environment:
      - TZ=America/New_York
      - MCP_TOKEN=${MCP_TOKEN:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - USER_EMAIL=${USER_EMAIL:-}
      - USER_PASSWORD=${USER_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:6575"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s