# Date     : 2026-10-02
# Version  : v0.0.2
# Project  : AI Task Agent
# Software : Docker version 29.8.1
# ----------------------------------------------------------------------
# Description:
#   Docker compose file for building Web Server and MCP Server.
#
# References:
#   Docker Docs: docs.docker.com
# ----------------------------------------------------------------------

services:
  ai-task-agent:
    build:
      context: .
      dockerfile: dockerfiles/web-server/Dockerfile
    ports:
      - "6573:6573"
    depends_on:
      mcp-server:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: dockerfiles/mcp-server/Dockerfile
    ports:
      - "6574:6574"
      - "127.0.0.1:6576:6576"
    volumes:
      - ./transfer:/transfer
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 6574), 2)"]
      interval: 2s
      timeout: 3s
      retries: 15
